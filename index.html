<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Game Aesthetic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f6f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            background-color: #f8f6f0;
            touch-action: none;
            display: block;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// CONSTANTS & CONFIGS
const GRID_SIZE = 20;
const MIN_WIDTH = 320;
const MIN_HEIGHT = 480;
const CONTROL_HEIGHT = 150;

let WIDTH = 800;
let HEIGHT = 600;

// WARNA TEMA AESTHETIC (PASTEL DREAMY)
const BACKGROUND = "#f8f6f0";
const GRID_COLOR = "#ebe6de";
const TEXT_MAIN = "#414b56";
const TEXT_MUTED = "#969ba5";
const CONTROL_BG = "#eeeate";
const BUTTON_BG = "#ffffff";
const BUTTON_HOVER = "#f0ebf5";

const SNAKE_PALETTE = [
    "#ff69b4", "#ff82c3", "#ff9bd2", "#f050a0", "#ffb4dc"
];

const FOOD_COLORS = [
    "#f4acb7", "#b1d4e0", "#fce2ab", "#d8bfd8", "#c1e1c1"
];

function getAestheticGradient(index) {
    return SNAKE_PALETTE[index % SNAKE_PALETTE.length];
}

// RESIZE SYSTEM
function resizeWindow() {
    WIDTH = Math.max(MIN_WIDTH, window.innerWidth);
    HEIGHT = Math.max(MIN_HEIGHT, window.innerHeight);
    canvas.width = WIDTH;
    canvas.height = HEIGHT;
    if (joystick) {
        joystick.centerX = WIDTH / 2;
        joystick.centerY = HEIGHT - CONTROL_HEIGHT / 2;
        if (!joystick.isDraggingKnob) {
            joystick.knobX = joystick.centerX;
            joystick.knobY = joystick.centerY;
        }
    }
}
window.addEventListener('resize', resizeWindow);

// DRAWING HELPERS
function drawAestheticCard(x, y, w, h, bgColor, borderColor, borderRadius = 22, alpha = 1.0) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, borderRadius);
    ctx.fillStyle = bgColor;
    ctx.fill();
    if (borderColor) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = borderColor;
        ctx.stroke();
    }
    ctx.restore();
}

function drawCenteredText(text, font, color, y) {
    ctx.save();
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, WIDTH / 2, y);
    ctx.restore();
}

function drawBackground() {
    ctx.fillStyle = BACKGROUND;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    
    ctx.strokeStyle = GRID_COLOR;
    ctx.lineWidth = 1;
    for (let y = 0; y < HEIGHT - CONTROL_HEIGHT; y += GRID_SIZE) {
        for (let x = 0; x < WIDTH; x += GRID_SIZE) {
            ctx.strokeRect(x, y, GRID_SIZE, GRID_SIZE);
        }
    }
}

// PARTICLE SYSTEM
class ParticleSystem {
    constructor() {
        this.particles = [];
    }

    emit(x, y, color) {
        for (let i = 0; i < 12; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.5 + Math.random() * 3.0;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 3 + Math.random() * 2,
                color,
                life: 1.0
            });
        }
    }

    updateAndDraw() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.03;
            p.radius *= 0.94;

            if (p.life <= 0 || p.radius <= 0.5) {
                this.particles.splice(i, 1);
            } else {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life * 0.86);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
    }
}
const particleSystem = new ParticleSystem();

// JOYSTICK CLASS
class MovableJoystick {
    constructor(x, y, radius = 55, knobRadius = 22) {
        this.centerX = x;
        this.centerY = y;
        this.radius = radius;
        this.knobRadius = knobRadius;
        this.knobX = x;
        this.knobY = y;
        this.isDraggingKnob = false;
        this.isDraggingBase = false;
        this.dragOffsetX = 0;
        this.dragOffsetY = 0;
    }

    draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.centerX, this.centerY, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgb(225, 220, 210)";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgb(205, 198, 185)";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.knobX, this.knobY, this.knobRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgb(180, 190, 180)";
        ctx.stroke();
        ctx.restore();
    }

    handlePress(mx, my) {
        const dist = Math.hypot(mx - this.centerX, my - this.centerY);
        if (dist <= this.radius) {
            this.isDraggingKnob = true;
            return this._updateKnob(mx, my);
        } else if (dist <= this.radius + 20) {
            this.isDraggingBase = true;
            this.dragOffsetX = this.centerX - mx;
            this.dragOffsetY = this.centerY - my;
        }
        return null;
    }

    handleMove(mx, my) {
        if (this.isDraggingKnob) {
            return this._updateKnob(mx, my);
        } else if (this.isDraggingBase) {
            this.centerX = mx + this.dragOffsetX;
            this.centerY = my + this.dragOffsetY;
            this.knobX = this.centerX;
            this.knobY = this.centerY;
        }
        return null;
    }

    handleRelease() {
        this.isDraggingKnob = false;
        this.isDraggingBase = false;
        this.knobX = this.centerX;
        this.knobY = this.centerY;
    }

    _updateKnob(mx, my) {
        const dx = mx - this.centerX;
        const dy = my - this.centerY;
        const dist = Math.hypot(dx, dy);
        const maxDist = this.radius - this.knobRadius;

        if (dist > maxDist) {
            const angle = Math.atan2(dy, dx);
            this.knobX = this.centerX + Math.cos(angle) * maxDist;
            this.knobY = this.centerY + Math.sin(angle) * maxDist;
        } else {
            this.knobX = mx;
            this.knobY = my;
        }

        if (dist > 15) {
            if (Math.abs(dx) > Math.abs(dy)) {
                return dx < 0 ? [-GRID_SIZE, 0] : [GRID_SIZE, 0];
            } else {
                return dy < 0 ? [0, -GRID_SIZE] : [0, GRID_SIZE];
            }
        }
        return null;
    }
}
let joystick = new MovableJoystick(WIDTH / 2, HEIGHT - CONTROL_HEIGHT / 2);

// FOOD FUNCTIONS
function createFood(snakeBody, otherFoods) {
    let x, y;
    while (true) {
        x = Math.floor(Math.random() * (WIDTH / GRID_SIZE)) * GRID_SIZE;
        y = Math.floor(Math.random() * ((HEIGHT - CONTROL_HEIGHT - 60) / GRID_SIZE)) * GRID_SIZE + 60;

        let inSnake = snakeBody.some(segment => segment[0] === x && segment[1] === y);
        let inFoods = otherFoods.some(food => food.x === x && food.y === y);

        if (!inSnake && !inFoods) break;
    }

    const shapes = ["lingkaran", "bintang", "donat", "hati", "permata"];
    return {
        x, y,
        bentuk: shapes[Math.floor(Math.random() * shapes.length)],
        warna: FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)],
        pulse: Math.random() * Math.PI * 2
    };
}

function drawFood(food) {
    const { x, y, warna, bentuk } = food;
    const cx = x + GRID_SIZE / 2;
    const cy = y + GRID_SIZE / 2;

    food.pulse += 0.08;
    const pulseSize = Math.sin(food.pulse) * 1.5;

    ctx.save();
    // Glow effect
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(0, 8 + pulseSize), 0, Math.PI * 2);
    ctx.fillStyle = warna;
    ctx.globalAlpha = 0.25;
    ctx.fill();
    ctx.globalAlpha = 1.0;

    if (bentuk === "lingkaran") {
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(0, 6.5 + pulseSize / 2), 0, Math.PI * 2);
        ctx.fillStyle = warna;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx - 2, cy - 2, 2, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
    } else if (bentuk === "donat") {
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(0, 7.5 + pulseSize / 2), 0, Math.PI * 2);
        ctx.fillStyle = warna;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = BACKGROUND;
        ctx.fill();
    } else if (bentuk === "bintang") {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const angle = -Math.PI / 2 + i * Math.PI / 5;
            const radius = (i % 2 === 0 ? 8 : 3.5) + pulseSize / 2;
            const px = cx + Math.cos(angle) * radius;
            const py = cy + Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = warna;
        ctx.fill();
    } else if (bentuk === "hati") {
        ctx.fillStyle = warna;
        ctx.beginPath();
        ctx.arc(cx - 3.5, cy - 2.5, 4, 0, Math.PI * 2);
        ctx.arc(cx + 3.5, cy - 2.5, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x + 3, y + 5);
        ctx.lineTo(x + 17, y + 5);
        ctx.lineTo(cx, y + 16);
        ctx.closePath();
        ctx.fill();
    } else if (bentuk === "permata") {
        ctx.beginPath();
        ctx.moveTo(cx, y + 2);
        ctx.lineTo(x + 17, cy);
        ctx.lineTo(cx, y + 18);
        ctx.lineTo(x + 3, cy);
        ctx.closePath();
        ctx.fillStyle = warna;
        ctx.fill();
    }
    ctx.restore();
}

function drawSnake(snakeBody, direction) {
    snakeBody.forEach((seg, i) => {
        const color = getAestheticGradient(i);
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(seg[0] + 1, seg[1] + 1, GRID_SIZE - 2, GRID_SIZE - 2, 8);
        ctx.fill();

        // Eye details for head
        if (i === 0) {
            const cx = seg[0] + GRID_SIZE / 2;
            const cy = seg[1] + GRID_SIZE / 2;
            const dirX = direction[0] > 0 ? 1 : (direction[0] < 0 ? -1 : 0);
            const dirY = direction[1] > 0 ? 1 : (direction[1] < 0 ? -1 : 0);

            let eye1, eye2;
            if (dirX !== 0) {
                eye1 = [cx + dirX * 3, cy - 4];
                eye2 = [cx + dirX * 3, cy + 4];
            } else {
                eye1 = [cx - 4, cy + dirY * 3];
                eye2 = [cx + 4, cy + dirY * 3];
            }

            [eye1, eye2].forEach(eye => {
                ctx.beginPath();
                ctx.arc(eye[0], eye[1], 3, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();

                ctx.beginPath();
                ctx.arc(eye[0] + dirX, eye[1] + dirY, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = TEXT_MAIN;
                ctx.fill();
            });
        }
        ctx.restore();
    });
}

// GAME STATES & VARS
let gameState = "LOADING"; // LOADING, MENU, PLAYING, PAUSED, GAMEOVER
let score = 0;
let speed = 3;
let snakeBody = [];
let direction = [GRID_SIZE, 0];
let nextDirection = [GRID_SIZE, 0];
let foods = [];
let mousePos = { x: 0, y: 0 };

// UI RECTS & HOVER STATES
let startButtonRect = { x: 0, y: 0, w: 0, h: 0 };
let restartBtnRect = { x: 0, y: 0, w: 0, h: 0 };
let menuBtnRect = { x: 0, y: 0, w: 0, h: 0 };

// LOADING SCREEN
let loadingProgress = 0;
let loadingStartTime = null;

function runLoadingScreen(timestamp) {
    if (!loadingStartTime) loadingStartTime = timestamp;
    const duration = 1800;
    loadingProgress = Math.min(100, Math.floor(((timestamp - loadingStartTime) / duration) * 100));

    drawBackground();

    const judulY = HEIGHT / 3;
    drawCenteredText("SNAKE GAME", "bold 70px sans-serif", "rgb(178, 206, 186)", judulY);
    drawCenteredText("S N A K E   G A M E", "26px sans-serif", TEXT_MUTED, judulY + 70);

    const barW = Math.min(360, WIDTH - 100);
    const barH = 18;
    const barX = WIDTH / 2 - barW / 2;
    const barY = HEIGHT / 2 + 80;

    drawAestheticCard(barX, barY, barW, barH, CONTROL_BG, "rgb(215, 210, 200)", 10);

    const fillW = Math.floor((loadingProgress / 100) * (barW - 6));
    if (fillW > 0) {
        drawAestheticCard(barX + 3, barY + 3, fillW, barH - 6, "rgb(178, 206, 186)", null, 8);
    }

    drawCenteredText(`Memuat keindahan... ${loadingProgress}%`, "16px sans-serif", TEXT_MUTED, barY + 40);

    if (loadingProgress >= 100) {
        gameState = "MENU";
    }
}

// MAIN MENU
function runMainMenu() {
    drawBackground();

    const bannerW = Math.min(480, WIDTH - 40);
    const bannerH = 160;
    const bannerX = WIDTH / 2 - bannerW / 2;
    const bannerY = 75;

    drawAestheticCard(bannerX, bannerY, bannerW, bannerH, BUTTON_BG, "rgb(225, 220, 210)", 25);

    const centerY = bannerY + bannerH / 2;
    drawCenteredText("SNAKE GAME", "bold 70px sans-serif", "rgb(178, 206, 186)", centerY - 20);
    drawCenteredText("S N A K E   G A M E", "26px sans-serif", TEXT_MUTED, centerY + 45);

    const tombolW = Math.min(280, WIDTH - 60);
    const tombolH = 60;
    startButtonRect = {
        x: WIDTH / 2 - tombolW / 2,
        y: bannerY + bannerH + 55,
        w: tombolW,
        h: tombolH
    };

    const isHover = isInsideRect(mousePos.x, mousePos.y, startButtonRect);

    drawAestheticCard(
        startButtonRect.x, startButtonRect.y, startButtonRect.w, startButtonRect.h,
        isHover ? BUTTON_HOVER : BUTTON_BG,
        isHover ? "rgb(178, 206, 186)" : "rgb(220, 215, 205)",
        18
    );

    ctx.save();
    ctx.font = "22px sans-serif";
    ctx.fillStyle = TEXT_MAIN;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("MULAI MAIN", startButtonRect.x + startButtonRect.w / 2, startButtonRect.y + startButtonRect.h / 2);
    ctx.restore();

    const infoCardX = WIDTH / 2 - 170;
    const infoCardY = startButtonRect.y + startButtonRect.h + 45;
    drawAestheticCard(infoCardX, infoCardY, 340, 36, CONTROL_BG, null, 12);
    drawCenteredText("Gunakan Layar Sentuh / Joystick / Keyboard", "15px sans-serif", TEXT_MUTED, infoCardY + 18);
}

// PAUSE OVERLAY
function drawPauseOverlay() {
    ctx.save();
    ctx.fillStyle = "rgba(248, 246, 240, 0.82)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.restore();

    drawCenteredText("PAUSED", "bold 50px sans-serif", "rgb(178, 206, 186)", HEIGHT / 2 - 20);
    drawCenteredText("Tekan P / Tap Layar untuk melanjutkan", "22px sans-serif", TEXT_MAIN, HEIGHT / 2 + 40);
}

// GAME OVER OVERLAY
function drawGameOverOverlay() {
    ctx.save();
    ctx.fillStyle = "rgba(248, 246, 240, 0.86)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.restore();

    const modalW = Math.min(420, WIDTH - 40);
    const modalH = 340;
    const modalX = WIDTH / 2 - modalW / 2;
    const modalY = HEIGHT / 2 - modalH / 2 - 10;

    drawAestheticCard(modalX, modalY, modalW, modalH, BUTTON_BG, "rgb(225, 220, 210)", 25);
    drawCenteredText("GAME OVER", "bold 46px sans-serif", "rgb(244, 172, 183)", modalY + 45);

    const scoreBoxX = modalX + modalW / 2 - 120;
    const scoreBoxY = modalY + 95;
    drawAestheticCard(scoreBoxX, scoreBoxY, 240, 60, CONTROL_BG, null, 15);

    drawCenteredText("SKOR KAMU", "14px sans-serif", TEXT_MUTED, scoreBoxY + 18);
    drawCenteredText(score.toString(), "bold 32px sans-serif", TEXT_MAIN, scoreBoxY + 42);

    const tombolW = 160;
    const tombolH = 48;
    const yBtn = modalY + modalH - 75;

    restartBtnRect = { x: modalX + modalW / 2 - tombolW - 10, y: yBtn, w: tombolW, h: tombolH };
    menuBtnRect = { x: modalX + modalW / 2 + 10, y: yBtn, w: tombolW, h: tombolH };

    const hoverR = isInsideRect(mousePos.x, mousePos.y, restartBtnRect);
    const hoverM = isInsideRect(mousePos.x, mousePos.y, menuBtnRect);

    drawAestheticCard(restartBtnRect.x, restartBtnRect.y, restartBtnRect.w, restartBtnRect.h, hoverR ? BUTTON_HOVER : CONTROL_BG, hoverR ? "rgb(178, 206, 186)" : null, 12);
    drawAestheticCard(menuBtnRect.x, menuBtnRect.y, menuBtnRect.w, menuBtnRect.h, hoverM ? BUTTON_HOVER : CONTROL_BG, hoverM ? "rgb(244, 172, 183)" : null, 12);

    drawCenteredText("MAIN LAGI", "20px sans-serif", TEXT_MAIN, restartBtnRect.y + restartBtnRect.h / 2);
    drawCenteredText("MENU", "20px sans-serif", TEXT_MAIN, menuBtnRect.y + menuBtnRect.h / 2);
}

// INIT GAME ENGINE
function initGame() {
    const startX = Math.floor(WIDTH / 2 / GRID_SIZE) * GRID_SIZE;
    const startY = Math.floor((HEIGHT - CONTROL_HEIGHT) / 2 / GRID_SIZE) * GRID_SIZE;

    snakeBody = [
        [startX, startY],
        [startX - GRID_SIZE, startY],
        [startX - GRID_SIZE * 2, startY]
    ];

    direction = [GRID_SIZE, 0];
    nextDirection = [GRID_SIZE, 0];
    score = 0;
    speed = 3;
    foods = [];
    for (let i = 0; i < 5; i++) {
        foods.push(createFood(snakeBody, foods));
    }
}

let lastStepTime = 0;

function updateGameLogic(timestamp) {
    if (gameState !== "PLAYING") return;

    if (timestamp - lastStepTime > 1000 / speed) {
        lastStepTime = timestamp;

        direction = [...nextDirection];
        const kepalaX = snakeBody[0][0] + direction[0];
        const kepalaY = snakeBody[0][1] + direction[1];
        const kepalaBaru = [kepalaX, kepalaY];

        snakeBody.unshift(kepalaBaru);

        let makan = false;

        for (let i = foods.length - 1; i >= 0; i--) {
            let food = foods[i];
            if (kepalaX === food.x && kepalaY === food.y) {
                makan = true;
                score += 1;
                particleSystem.emit(food.x + GRID_SIZE / 2, food.y + GRID_SIZE / 2, food.warna);
                foods.splice(i, 1);
                foods.push(createFood(snakeBody, foods));
                if (score % 8 === 0) {
                    speed += 0.5;
                }
                break;
            }
        }

        if (!makan) {
            snakeBody.pop();
        }

        // Collision Check
        const hitWall = (
            kepalaX < 0 ||
            kepalaX >= WIDTH ||
            kepalaY < 0 ||
            kepalaY >= HEIGHT - CONTROL_HEIGHT
        );

        const hitSelf = snakeBody.slice(1).some(seg => seg[0] === kepalaX && seg[1] === kepalaY);

        if (hitWall || hitSelf) {
            gameState = "GAMEOVER";
        }
    }
}

// MAIN LOOP
function gameLoop(timestamp) {
    resizeWindow();

    if (gameState === "LOADING") {
        runLoadingScreen(timestamp);
    } else if (gameState === "MENU") {
        runMainMenu();
    } else {
        updateGameLogic(timestamp);

        // Render Game
        drawBackground();
        foods.forEach(food => drawFood(food));
        drawSnake(snakeBody, direction);
        particleSystem.updateAndDraw();

        // Kontrol & HUD UI Aesthetic
        ctx.fillStyle = CONTROL_BG;
        ctx.fillRect(0, HEIGHT - CONTROL_HEIGHT, WIDTH, CONTROL_HEIGHT);

        ctx.strokeStyle = "rgb(225, 220, 210)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, HEIGHT - CONTROL_HEIGHT);
        ctx.lineTo(WIDTH, HEIGHT - CONTROL_HEIGHT);
        ctx.stroke();

        joystick.draw();

        // Score Card
        drawAestheticCard(15, 15, 150, 42, BUTTON_BG, "rgb(225, 220, 210)", 12);
        ctx.font = "20px sans-serif";
        ctx.fillStyle = TEXT_MAIN;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(`SKOR: ${score}`, 26, 36);

        // Speed Card
        drawAestheticCard(WIDTH - 155, 15, 140, 42, BUTTON_BG, "rgb(225, 220, 210)", 12);
        ctx.font = "16px sans-serif";
        ctx.fillText(`SPEED: ${speed}`, WIDTH - 138, 36);

        if (gameState === "PAUSED") {
            drawPauseOverlay();
        } else if (gameState === "GAMEOVER") {
            drawGameOverOverlay();
        }
    }

    requestAnimationFrame(gameLoop);
}

// EVENT LISTENERS & CONTROLS
function isInsideRect(x, y, rect) {
    return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}

function handleInputDirection(dir) {
    if (dir && (dir[0] !== -direction[0] || dir[1] !== -direction[1])) {
        nextDirection = dir;
    }
}

window.addEventListener('keydown', (e) => {
    if (gameState === "MENU") {
        if (e.key === "Enter" || e.key === " ") {
            initGame();
            gameState = "PLAYING";
        }
    } else if (gameState === "PLAYING" || gameState === "PAUSED") {
        if (e.key === "Escape") {
            gameState = "MENU";
            return;
        }
        if (e.key === "p" || e.key === "P") {
            gameState = gameState === "PLAYING" ? "PAUSED" : "PLAYING";
            return;
        }

        if (gameState === "PLAYING") {
            let dir = null;
            if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") dir = [0, -GRID_SIZE];
            else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") dir = [0, GRID_SIZE];
            else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") dir = [-GRID_SIZE, 0];
            else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") dir = [GRID_SIZE, 0];
            handleInputDirection(dir);
        }
    } else if (gameState === "GAMEOVER") {
        if (e.key === "r" || e.key === "R") {
            initGame();
            gameState = "PLAYING";
        } else if (e.key === "Escape") {
            gameState = "MENU";
        }
    }
});

function handlePointerDown(x, y) {
    mousePos = { x, y };

    if (gameState === "MENU") {
        if (isInsideRect(x, y, startButtonRect)) {
            initGame();
            gameState = "PLAYING";
        }
    } else if (gameState === "PLAYING") {
        const dir = joystick.handlePress(x, y);
        handleInputDirection(dir);
    } else if (gameState === "PAUSED") {
        gameState = "PLAYING";
    } else if (gameState === "GAMEOVER") {
        if (isInsideRect(x, y, restartBtnRect)) {
            initGame();
            gameState = "PLAYING";
        } else if (isInsideRect(x, y, menuBtnRect)) {
            gameState = "MENU";
        }
    }
}

function handlePointerMove(x, y) {
    mousePos = { x, y };
    if (gameState === "PLAYING") {
        const dir = joystick.handleMove(x, y);
        handleInputDirection(dir);
    }
}

function handlePointerUp() {
    if (gameState === "PLAYING") {
        joystick.handleRelease();
    }
}

// MOUSE EVENTS
canvas.addEventListener('mousedown', (e) => {
    handlePointerDown(e.clientX, e.clientY);
});
canvas.addEventListener('mousemove', (e) => {
    handlePointerMove(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', () => {
    handlePointerUp();
});

// TOUCH EVENTS
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    handlePointerDown(touch.clientX, touch.clientY);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    handlePointerMove(touch.clientX, touch.clientY);
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    handlePointerUp();
}, { passive: false });

// START APPLICATION
resizeWindow();
requestAnimationFrame(gameLoop);
</script>
</body>
